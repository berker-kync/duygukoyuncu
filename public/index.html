<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Duygu Koyuncu, Mechanical Engineer</title>
  <meta name="description" content="Portfolio and résumé of Duygu Koyuncu, mechanical engineer. The site is under construction.">
  <meta name="theme-color" content="#9db3a5">
  <link rel="canonical" href="https://duygukoyuncu.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://duygukoyuncu.com/">
  <meta property="og:title" content="Duygu Koyuncu, Mechanical Engineer">
  <meta property="og:description" content="Portfolio and résumé, currently in pieces. Hold to assemble.">
  <meta property="og:image" content="https://duygukoyuncu.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/michroma-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="page">
    <canvas id="scene" aria-hidden="true"></canvas>
    <svg id="leaders" aria-hidden="true"></svg>
    <div id="balloons" aria-hidden="true"></div>

    <header class="intro">
      <h1><span>Duygu</span> <span>Koyuncu</span></h1>
      <p class="role">Mechanical engineer</p>
      <p class="message">Portfolio and résumé, currently in&nbsp;pieces. The finished site will be assembled here.</p>
    </header>

    <div class="stage" id="stage"></div>

    <main class="plate">
      <i class="rivet"></i><i class="rivet"></i><i class="rivet"></i><i class="rivet"></i>
      <section class="parts" aria-label="What is coming">
        <ol>
          <li data-part="ring"><b>1</b><span class="will">Projects</span><span class="part">Ring gear, 60T</span></li>
          <li data-part="planets"><b>2</b><span class="will">Experience</span><span class="part">Planets ×3, 18T</span></li>
          <li data-part="sun"><b>3</b><span class="will">Résumé</span><span class="part">Sun gear, 24T</span></li>
          <li data-part="carrier"><b>4</b><span class="will">Contact</span><span class="part">Carrier, 3 pins</span></li>
        </ol>
      </section>
      <dl class="gauge needs-js" aria-hidden="true">
        <div><dt>In</dt><dd><output id="rpm-in">0.0</output> rpm</dd></div>
        <div><dt>Out</dt><dd><output id="rpm-out">0.0</output> rpm</dd></div>
        <div><dt>Ratio</dt><dd>3.5 : 1</dd></div>
      </dl>
      <div class="control needs-js">
        <button type="button" id="hold" aria-describedby="state"><span class="cap"></span><span class="label">Hold to assemble</span></button>
        <p id="state" role="status">In pieces</p>
      </div>
    </main>
  </div>
</body>
</html>
